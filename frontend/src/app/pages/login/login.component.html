<section style="max-width: 420px; margin: 2rem auto">
  <article>
    <hgroup>
      <h2>Iniciar sesión</h2>
      <p>Elige cómo quieres entrar</p>
    </hgroup>

    <div class="grid role-toggle">
      <button type="button" [class]="role === 'org' ? '' : 'secondary'" (click)="selectRole('org')">
        Organización
      </button>
      <button
        type="button"
        [class]="role === 'candidate' ? '' : 'secondary'"
        (click)="selectRole('candidate')"
      >
        Candidato
      </button>
    </div>

    @if (error) {
      <p style="color:#b91c1c">{{ error }}</p>
    }

    <form (ngSubmit)="submit()">
      <label>
        Correo
        <input type="email" name="email" [(ngModel)]="email" required autocomplete="username" />
      </label>
      <label>
        Contraseña
        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          required
          autocomplete="current-password"
        />
      </label>
      <button type="submit" [disabled]="loading">
        {{ loading ? 'Ingresando...' : 'Ingresar' }}
      </button>
    </form>

    <p><small>¿No tienes cuenta? <a routerLink="/register" [queryParams]="{ role }">Crear cuenta</a></small></p>
  </article>
</section>
