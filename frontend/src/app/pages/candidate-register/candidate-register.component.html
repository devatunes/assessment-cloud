<section style="max-width: 420px; margin: 2rem auto">
  <article>
    <hgroup>
      <h2>Regístrate para practicar</h2>
      <p>Accede al catálogo público de simulacros, sin necesitar invitación</p>
    </hgroup>

    @if (error) {
      <p style="color:#b91c1c">{{ error }}</p>
    }

    <form (ngSubmit)="submit()">
      <label>
        Tu nombre
        <input type="text" name="name" [(ngModel)]="name" required />
      </label>
      <label>
        Correo
        <input type="email" name="email" [(ngModel)]="email" required autocomplete="username" />
      </label>
      <label>
        Contraseña (mínimo 8 caracteres)
        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          required
          minlength="8"
          autocomplete="new-password"
        />
      </label>
      <button type="submit" [disabled]="loading">
        {{ loading ? 'Creando...' : 'Crear cuenta' }}
      </button>
    </form>

    <p><small>¿Ya tienes cuenta? <a routerLink="/candidato/login">Inicia sesión</a></small></p>
  </article>
</section>
