<section style="max-width: 420px; margin: 2rem auto">
  <article>
    <hgroup>
      <h2>Practicar</h2>
      <p>Acceso para candidatos</p>
    </hgroup>

    @if (error) {
      <p style="color:#b91c1c">{{ error }}</p>
    }

    <form (ngSubmit)="submit()">
      <label>
        Correo
        <input type="email" name="email" [(ngModel)]="email" required autocomplete="username" />
      </label>
      <label>
        Contraseña
        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          required
          autocomplete="current-password"
        />
      </label>
      <button type="submit" [disabled]="loading">
        {{ loading ? 'Ingresando...' : 'Ingresar' }}
      </button>
    </form>

    <p><small>¿No tienes cuenta? <a routerLink="/candidato/registro">Regístrate para practicar</a></small></p>
    <p><small>¿Eres reclutador? <a routerLink="/login">Inicia sesión de organización</a></small></p>
  </article>
</section>
