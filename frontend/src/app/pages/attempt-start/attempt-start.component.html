<section>
  @if (loading) {
    <p aria-busy="true">Cargando assessment...</p>
  }
  @if (error) {
    <p style="color:#b91c1c">{{ error }}</p>
  }

  @if (assessment) {
    <article>
      <h2>{{ assessment.name }}</h2>
      <p>{{ assessment.description }}</p>

      <label>
        Tu nombre
        <input type="text" [(ngModel)]="candidateName" name="candidateName" placeholder="Nombre completo" />
      </label>
      <label>
        Correo (opcional)
        <input type="email" [(ngModel)]="candidateEmail" name="candidateEmail" />
      </label>

      <button (click)="start()" [disabled]="starting">
        {{ starting ? 'Iniciando...' : 'Comenzar assessment' }}
      </button>
    </article>
  }
</section>
