# Sirve el build de Angular con fallback de rutas SPA (equivalente a los
# custom_error_response 403/404 -> index.html que usa CloudFront en AWS).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
