name: Requirements

on:
  pull_request:
    branches:
      - staging
      - master

jobs:
  backend-unit-tests:
    name: Backend — requirements + unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias (requirements)
        run: npm ci

      - name: Pruebas unitarias
        run: npm test
